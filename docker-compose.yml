version: '3.8'

services:
  # Database Service (PostgreSQL + PostGIS)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gis_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gis_assets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql

  # Backend Service
  backend:
    build: ./gis-asset-backend
    container_name: gis_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: gis_assets
      PORT: 5000
    depends_on:
      - postgres

  # Frontend Service
  frontend:
    build: ./gis-asset-frontend
    container_name: gis_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: