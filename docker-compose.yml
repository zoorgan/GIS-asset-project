version: '3.8'

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: gis_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gis_assets
    ports:
      - "5432:7000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql

 
  backend:
    build: ./gis-asset-backend
    container_name: gis_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 7000
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: gis_assets
      PORT: 5000
    depends_on:
      - postgres

  
  frontend:
    build: ./gis-asset-frontend
    container_name: gis_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: